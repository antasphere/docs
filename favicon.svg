<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">Antasphere mark</title>
  <!-- The Antasphere X-ray sphere on a creme tile. Fills only, no strokes,
       because stroke rendering differs across rasterisers and a favicon has to
       survive all of them. The mark path is the same one as
       src/components/BrandMark.astro; public/icons/*.png are rasterised from
       this file and must be regenerated together with it (og-default.png
       carries the mark too). Keep the viewBox square. -->
  <rect width="64" height="64" rx="14" fill="#F7F4EC"/>
  <g transform="translate(8.136 8.136) scale(0.09322)">
    <path fill="#1C1915" d="M 256,23 A 233,233 0 0 1 256,489 A 233,233 0 0 1 256,23 Z M 256,49 A 207,207 0 0 0 256,463 A 207,207 0 0 0 256,49 Z M 23,256 A 233,90 0 0 1 489,256 A 233,90 0 0 1 23,256 Z M 49,256 A 207,64 0 0 0 463,256 A 207,64 0 0 0 49,256 Z M 256,23 A 90,233 0 0 1 256,489 A 90,233 0 0 1 256,23 Z M 256,49 A 64,207 0 0 0 256,463 A 64,207 0 0 0 256,49 Z"/>
  </g>
</svg>
