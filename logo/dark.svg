  <!-- The Antasphere lockup, for dark mode. Geometry is the website's
       BrandLockup.astro, in a 100-unit em: the mark 1em with its box bottom on
       the baseline and dropped 23.2%, a 0.4em gap, the word at 0.92em with
       0.02em tracking. The word is Sentient Light outlined into paths, because
       docs.json loads a logo as an <img> and no webfont reaches it there, so a
       wordmark that must be Sentient cannot be live text. Regenerate both files
       together; the mark path is the one in company/website BrandMark.astro and
       in favicon.svg. Mintlify's logo.light / logo.dark name the MODE the file
       is shown in, not the ink it carries. -->
